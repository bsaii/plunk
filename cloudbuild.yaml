# Cloud Build pipeline: API, web, maintenance, and the Cloud Tasks worker.
# Terraform owns the first creation and all configuration; every deploy step
# below fails if its required Cloud Run resource is missing.

substitutions:
  _REGION: us-central1
  _AR_REPO: plunk
  _API_SERVICE: plunk-api
  _WEB_SERVICE: plunk-web
  _MIGRATE_JOB: plunk-migrate
  _MAINTENANCE_JOB: plunk-maintenance
  _WORKER_SERVICE: plunk-worker
  _LEGACY_WORKER_POOL: plunk-worker
  _TAG: latest

timeout: 2400s

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-base
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "--platform=linux/amd64", "--target=builder", "-t=plunk-builder:${_TAG}", "-f=Dockerfile", "."]

  - id: build-prod-deps
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "--platform=linux/amd64", "--target=prod-deps", "-t=plunk-prod-deps:${_TAG}", "-f=Dockerfile", "."]

  - id: build-api
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    waitFor: ["build-base", "build-prod-deps"]
    args: ["build", "--platform=linux/amd64", "--build-arg=PLUNK_VERSION=${_TAG}", "--target=api-runner", "-t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${_TAG}", "-f=Dockerfile.services", "."]

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-api"]
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${_TAG}"]

  - id: check-api-exists
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "services", "describe", "${_API_SERVICE}", "--region=${_REGION}", "--format=value(metadata.name)"]

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: ["push-api", "check-api-exists"]
    args: ["run", "deploy", "${_API_SERVICE}", "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${_TAG}", "--region=${_REGION}"]

  - id: update-migrate-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: ["push-api"]
    args: ["run", "jobs", "update", "${_MIGRATE_JOB}", "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:${_TAG}", "--region=${_REGION}"]

  - id: build-maintenance
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    waitFor: ["build-base", "build-prod-deps"]
    args: ["build", "--platform=linux/amd64", "--build-arg=PLUNK_VERSION=${_TAG}", "--target=maintenance-runner", "-t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/maintenance:${_TAG}", "-f=Dockerfile.services", "."]

  - id: push-maintenance
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-maintenance"]
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/maintenance:${_TAG}"]

  - id: update-maintenance-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: ["push-maintenance"]
    args: ["run", "jobs", "update", "${_MAINTENANCE_JOB}", "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/maintenance:${_TAG}", "--region=${_REGION}"]

  - id: build-web
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    waitFor: ["build-base", "build-prod-deps"]
    args: ["build", "--platform=linux/amd64", "--build-arg=PLUNK_VERSION=${_TAG}", "--target=web-runner", "-t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${_TAG}", "-f=Dockerfile.services", "."]

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-web"]
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${_TAG}"]

  - id: check-web-exists
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "services", "describe", "${_WEB_SERVICE}", "--region=${_REGION}", "--format=value(metadata.name)"]

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: ["push-web", "check-web-exists"]
    args: ["run", "deploy", "${_WEB_SERVICE}", "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:${_TAG}", "--region=${_REGION}"]

  # The HTTP worker is the Phase 3 destination. It runs worker-server.js and
  # accepts only Cloud Tasks OIDC delivery; it is never made public.
  - id: build-worker
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    waitFor: ["build-base", "build-prod-deps"]
    args: ["build", "--platform=linux/amd64", "--build-arg=PLUNK_VERSION=${_TAG}", "--target=worker-server", "-t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker:${_TAG}", "-f=Dockerfile.services", "."]

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-worker"]
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker:${_TAG}"]

  - id: check-worker-exists
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "services", "describe", "${_WORKER_SERVICE}", "--region=${_REGION}", "--format=value(metadata.name)"]

  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    waitFor: ["push-worker", "check-worker-exists"]
    args: ["run", "deploy", "${_WORKER_SERVICE}", "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker:${_TAG}", "--region=${_REGION}"]

  # Transitional only: while the legacy Worker Pool still exists, keep it on
  # current processor code. Once Terraform removes it at the guarded cutover,
  # this step becomes a no-op rather than failing future application deploys.
  - id: build-legacy-worker
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    waitFor: ["build-base", "build-prod-deps"]
    args: ["build", "--platform=linux/amd64", "--build-arg=PLUNK_VERSION=${_TAG}", "--target=worker-runner", "-t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker-legacy:${_TAG}", "-f=Dockerfile.services", "."]

  - id: push-legacy-worker
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-legacy-worker"]
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker-legacy:${_TAG}"]

  - id: update-legacy-worker-pool-if-present
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: ["push-legacy-worker"]
    args:
      - -ceu
      - |
        if gcloud run worker-pools describe "${_LEGACY_WORKER_POOL}" --region="${_REGION}" --format='value(metadata.name)' >/dev/null 2>&1; then
          gcloud run worker-pools update "${_LEGACY_WORKER_POOL}" --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker-legacy:${_TAG}" --region="${_REGION}"
        fi
